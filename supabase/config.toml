project_id = "ruapdkrgcbqrhvsayvpf"

# sync-faculty authenticates callers itself (CRON_SECRET header, or an admin
# JWT) so the platform gate is redundant. Leaving verify_jwt on would also break
# the scheduled invocation, which carries no user JWT.
[functions.sync-faculty]
verify_jwt = false

# send-email-queue authenticates callers itself (CRON_SECRET header, or an admin
# JWT), because the scheduled sweep carries no user JWT. Unlike the function it
# replaces, it takes no recipient or content from the request, so an
# unauthenticated caller could at worst ask it to look at the queue.
[functions.send-email-queue]
verify_jwt = false

# email-unsubscribe is deliberately public: a one-click opt-out link in an email
# footer cannot require a login. It is authorised by an opaque per-user token and
# can only ever turn notifications off.
[functions.email-unsubscribe]
verify_jwt = false

# sync-srmap-events authenticates callers itself (CRON_SECRET header, or an
# admin JWT), same reasoning as sync-faculty: the scheduled daily sync carries
# no user JWT at all.
[functions.sync-srmap-events]
verify_jwt = false

# embed-knowledge authenticates callers itself (CRON_SECRET header, or an admin
# JWT), same reasoning as sync-faculty: the scheduled embedding sweep carries
# no user JWT. This function was already deployed with verify_jwt off but had
# no entry here, so the next `functions deploy` without an explicit flag would
# have silently reverted it to the platform default and broken the cron path.
[functions.embed-knowledge]
verify_jwt = false

# semantic-search is the public search endpoint and must work for signed-out
# students, so it cannot require a platform-level JWT. Same drift risk as
# embed-knowledge above: deployed correctly, but undeclared here.
[functions.semantic-search]
verify_jwt = false

# seed-campus-documents authenticates itself via a dedicated x-ingest-secret
# header (INGEST_SECRET, not the platform JWT and not CRON_SECRET), because
# it's a developer-run ingestion tool invoked from a terminal, not from the
# app. See the file header comment for why campus_documents needs a
# service-role writer at all.
[functions.seed-campus-documents]
verify_jwt = false

# generate-mentor-summary authenticates callers itself (CRON_SECRET, the service
# role, or an admin JWT), same reasoning as embed-knowledge: the scheduled sweep
# that regenerates summaries after a mentor edits their profile carries no user
# JWT. It writes to public.mentors with the service role, so the in-code check is
# the only real gate -- do not rely on the platform one.
[functions.generate-mentor-summary]
verify_jwt = false

# sync-srm-portal authenticates callers itself (CRON_SECRET header, or an
# admin JWT), same reasoning as sync-faculty: the scheduled daily unattended
# sync carries no user JWT at all.
[functions.sync-srm-portal]
verify_jwt = false

# import-srm-portal authenticates callers itself (via supabaseAdmin.auth.getUser
# in code against the Bearer header).
[functions.import-srm-portal]
verify_jwt = false

# parse-linkedin-pdf authenticates callers itself (via supabaseAdmin.auth.getUser
# in code against the Bearer header), same shape as import-srm-portal. It had no
# entry here -- the exact drift risk the embed-knowledge comment above warns
# about: a `functions deploy` with no explicit flag reverts to the platform
# default instead of what's actually running.
[functions.parse-linkedin-pdf]
verify_jwt = false

# send-push authenticates callers in code
[functions.send-push]
verify_jwt = false


